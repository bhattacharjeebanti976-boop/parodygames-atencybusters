<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop Destroyer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0b0f;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:none;background:#0b0b0f}
  .ui{position:fixed;z-index:5;display:flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;
    color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);border-radius:10px;font-size:15px;
    text-decoration:none;opacity:.55;touch-action:manipulation;cursor:pointer;padding:0 12px;box-sizing:border-box}
  .ui:hover,.ui:active{opacity:.95}
  #back{left:calc(6px + env(safe-area-inset-left));top:calc(6px + env(safe-area-inset-top));min-height:44px;min-width:44px;font-size:14px}
  #fs{right:calc(6px + env(safe-area-inset-right));top:calc(6px + env(safe-area-inset-top))}
  #esc{display:none;right:calc(60px + env(safe-area-inset-right));top:calc(6px + env(safe-area-inset-top))}
  @media (pointer:coarse){#esc{display:flex}}
  #hint{position:fixed;z-index:6;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;
    background:rgba(0,0,0,.75);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:10px 16px;font-size:14px;
    text-align:center;max-width:80vw}
  #over{position:fixed;inset:0;z-index:7;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:#0b0b0f;color:#ddd;gap:16px;font-size:18px}
  #over button{min-height:48px;min-width:140px;font-size:16px;border-radius:10px;border:1px solid #666;background:#222;color:#fff;cursor:pointer}
  #over a{color:#999;font-size:14px;min-height:44px;display:flex;align-items:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" class="ui" href="../../index.html">&larr; Back</a>
<div id="esc" class="ui" role="button" aria-label="Escape (close)">Esc</div>
<div id="fs" class="ui" role="button" aria-label="Fullscreen">&#x26F6;</div>
<div id="hint">Tip: rotate your phone to landscape for a wider desktop</div>
<div id="over"><div>Desktop Destroyer closed</div><button id="again">Play again</button><a href="../../index.html">&larr; Back</a></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=1280,H=720,scale=1,dpr=1;
var bugImg=null,bugOK=false;
var bugs,items,running,hammer;
var acc=0,last=0,STEP=30;

// assets: bug.png (hammer.png/crack.png/smash.wav don't exist in the original folder -> same fallbacks)
(function(){var i=new Image();i.onload=function(){bugImg=i;bugOK=true;};i.onerror=function(){};i.src='bug.png';})();

// audio
var AC=null,squashBuf=null,curSrc=null,audioTried=false;
function unlockAudio(){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}
    if(AC.state==='suspended')AC.resume();
    if(!audioTried){audioTried=true;
      fetch('squash.wav').then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();})
      .then(function(b){return new Promise(function(res,rej){AC.decodeAudioData(b,res,rej);});})
      .then(function(buf){squashBuf=buf;}).catch(function(){squashBuf=null;});
    }
  }catch(e){}
}
function playSquash(){
  try{
    if(!AC)return;
    if(curSrc){try{curSrc.stop();}catch(e){} curSrc=null;} // SND_ASYNC replaces previous sound
    var s=AC.createBufferSource(),g=AC.createGain();
    if(squashBuf){s.buffer=squashBuf;g.gain.value=1;}
    else{ // synth beep fallback
      var n=Math.floor(AC.sampleRate*0.12),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
      for(var i=0;i<n;i++){var t=i/AC.sampleRate;d[i]=Math.sin(2*Math.PI*(260-1200*t)*t)*(1-i/n)*0.6+(Math.random()*2-1)*0.2*(1-i/n);}
      s.buffer=b;g.gain.value=0.7;
    }
    s.connect(g);g.connect(AC.destination);s.start();curSrc=s;
  }catch(e){}
}
// smash.wav missing in original -> silent

// display list bottom->top, emulating canvas item stacking (tag_lower / tag_raise)
function rnd(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return Math.floor(rnd(a,b+1));}
function lower(o){items.unshift(o);}
function raise(o){var i=items.indexOf(o);if(i>=0)items.splice(i,1);items.push(o);}

function spawnBug(){
  var x=ri(100,W-100),y=ri(100,H-100),ang=rnd(0,2*Math.PI),sp=rnd(2,4);
  var b={t:'bug',x:x,y:y,dx:Math.cos(ang)*sp,dy:Math.sin(ang)*sp,alive:true,radius:35};
  bugs.push(b);items.push(b);
}
function newGame(){
  bugs=[];items=[];running=true;
  hammer={t:'hammer',x:0,y:0};items.push(hammer);
  for(var i=0;i<10;i++)spawnBug();
  acc=0;last=0;
  document.getElementById('over').style.display='none';
}
function drawCrack(x,y){
  var n=ri(7,10);
  for(var i=0;i<n;i++){
    var a=rnd(0,2*Math.PI),len=ri(50,130),ex=x+len*Math.cos(a),ey=y+len*Math.sin(a);
    lower({t:'line',x1:x,y1:y,x2:ex,y2:ey,c:'#fff',w:2});
    lower({t:'line',x1:x+1,y1:y+1,x2:ex+1,y2:ey+1,c:'#000',w:1});
  }
}
function whack(x,y){
  if(!running)return;
  var hit=false;
  for(var i=0;i<bugs.length;i++){
    var b=bugs[i];
    if(b.alive&&Math.hypot(b.x-x,b.y-y)<=b.radius){
      b.alive=false;
      var k=items.indexOf(b);if(k>=0)items.splice(k,1);
      lower({t:'splat',x:x,y:y});
      playSquash();hit=true;break;
    }
  }
  if(!hit)drawCrack(x,y);
}
function update(){
  for(var i=0;i<bugs.length;i++){
    var b=bugs[i];if(!b.alive)continue;
    b.x+=b.dx;b.y+=b.dy;
    if(b.x<=30||b.x>=W-30)b.dx*=-1;
    if(b.y<=30||b.y>=H-30)b.dy*=-1;
  }
}

// fake desktop (stands in for the real OS desktop the original overlays transparently)
function drawDesktop(){
  var g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#1f5fa8');g.addColorStop(0.55,'#2e86c9');g.addColorStop(1,'#14406f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var rg=ctx.createRadialGradient(W*0.7,H*0.3,10,W*0.7,H*0.3,Math.max(W,H)*0.5);
  rg.addColorStop(0,'rgba(255,255,255,.18)');rg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  var icons=[['This PC','#e8c14a'],['Recycle Bin','#99aadd'],['Documents','#e8c14a'],['Browser','#44aa99'],['Notes','#dddddd']];
  ctx.font='13px Segoe UI,Arial,sans-serif';ctx.textAlign='center';
  for(var i=0;i<icons.length;i++){
    var ix=48,iy=130+i*92;
    ctx.fillStyle=icons[i][1];ctx.fillRect(ix-18,iy-20,36,32);
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(ix-18,iy-20,36,8);
    ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=3;ctx.fillText(icons[i][0],ix,iy+30);ctx.shadowBlur=0;
  }
  var wx=W*0.28,wy=H*0.18,ww=Math.min(520,W*0.5),wh=Math.min(300,H*0.45);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(wx+6,wy+6,ww,wh);
  ctx.fillStyle='#f3f3f3';ctx.fillRect(wx,wy,ww,wh);
  ctx.fillStyle='#2b579a';ctx.fillRect(wx,wy,ww,28);
  ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='13px Segoe UI,Arial,sans-serif';ctx.fillText('Untitled - Notepad',wx+10,wy+19);
  ctx.fillStyle='#cc3333';ctx.fillRect(wx+ww-28,wy,28,28);
  ctx.fillStyle='#cccccc';for(var j=0;j<7;j++)ctx.fillRect(wx+14,wy+46+j*28,ww*(0.4+0.5*((j*37)%10)/10),6);
  ctx.fillStyle='#101820';ctx.fillRect(0,H-40,W,40);
  ctx.fillStyle='#2e86c9';ctx.fillRect(8,H-34,28,28);
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(48,H-34,150,28);
  ctx.fillStyle='#fff';ctx.font='12px Segoe UI,Arial,sans-serif';ctx.textAlign='right';ctx.fillText('12:00',W-12,H-16);
}
function draw(){
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  drawDesktop();
  for(var i=0;i<items.length;i++){
    var o=items[i];
    if(o.t==='bug'){
      if(bugOK)ctx.drawImage(bugImg,o.x-30,o.y-30,60,60);
      else{
        ctx.beginPath();ctx.ellipse(o.x,o.y,16,20,0,0,6.2832);ctx.fillStyle='#1c1c1c';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#ff2222';ctx.stroke();
        ctx.beginPath();ctx.ellipse(o.x,o.y-21,10,7,0,0,6.2832);ctx.fillStyle='#8b0000';ctx.fill();
      }
    }else if(o.t==='splat'){
      ctx.beginPath();ctx.ellipse(o.x,o.y,22,20,0,0,6.2832);ctx.fillStyle='#cc0000';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#550000';ctx.stroke();
    }else if(o.t==='line'){
      ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.lineWidth=o.w;ctx.strokeStyle=o.c;ctx.lineCap='butt';ctx.stroke();
    }else if(o.t==='hammer'){
      var x=o.x,y=o.y;
      ctx.beginPath();ctx.moveTo(x,y-10);ctx.lineTo(x,y+25);ctx.lineWidth=6;ctx.strokeStyle='brown';ctx.lineCap='butt';ctx.stroke();
      ctx.fillStyle='silver';ctx.fillRect(x-15,y-25,30,15);ctx.lineWidth=1;ctx.strokeStyle='black';ctx.strokeRect(x-15,y-25,30,15);
    }
  }
}

// sizing: logical screen keeps aspect of the window (height 720 landscape / width 720 portrait)
var hintDone=false,hintT=0;
function resize(){
  var iw=window.innerWidth||document.documentElement.clientWidth,ih=window.innerHeight||document.documentElement.clientHeight;
  if(iw>=ih){H=720;W=Math.round(720*iw/ih);}else{W=720;H=Math.round(720*ih/iw);}
  scale=iw/W;dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=iw+'px';cv.style.height=ih+'px';
  cv.width=Math.round(iw*dpr);cv.height=Math.round(ih*dpr);
  if(bugs){for(var i=0;i<bugs.length;i++){var b=bugs[i];b.x=Math.min(Math.max(b.x,31),W-31);b.y=Math.min(Math.max(b.y,31),H-31);}}
  var portrait=ih>iw*1.1,coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
  var h=document.getElementById('hint');
  if(portrait&&coarse&&!hintDone){h.style.display='block';clearTimeout(hintT);hintT=setTimeout(function(){h.style.display='none';hintDone=true;},7000);}
  else if(!portrait){h.style.display='none';}
}
function pt(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)/scale,(e.clientY-r.top)/scale];}

// input
cv.addEventListener('pointermove',function(e){
  var p=pt(e);hammer.x=p[0];hammer.y=p[1];raise(hammer);e.preventDefault();
},{passive:false});
cv.addEventListener('pointerdown',function(e){
  unlockAudio();
  var p=pt(e);
  if(e.pointerType!=='mouse'||e.button===0){
    hammer.x=p[0];hammer.y=p[1];raise(hammer);
    whack(p[0],p[1]);
  }
  e.preventDefault();
},{passive:false});
['contextmenu','selectstart','dragstart','gesturestart'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();},{passive:false});});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});

function closeGame(){running=false;document.getElementById('over').style.display='flex';}
window.addEventListener('keydown',function(e){if(e.key==='Escape'&&running)closeGame();});
document.getElementById('esc').addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();if(running)closeGame();});
document.getElementById('again').addEventListener('click',function(){unlockAudio();newGame();});
document.getElementById('fs').addEventListener('pointerdown',function(e){
  e.preventDefault();e.stopPropagation();
  try{
    var d=document,el=d.documentElement;
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
    else{var f=el.requestFullscreen||el.webkitRequestFullscreen;if(f){var p=f.call(el);if(p&&p.catch)p.catch(function(){});}}
  }catch(err){}
});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,100);});

// fixed-timestep loop: 30 ms like root.after(30, update_game)
function frame(t){
  if(!last)last=t;
  acc+=t-last;last=t;
  if(acc>500)acc=500;
  while(acc>=STEP){if(running)update();acc-=STEP;}
  draw();
  requestAnimationFrame(frame);
}
resize();newGame();
requestAnimationFrame(frame);
window.__game={get bugs(){return bugs;},get items(){return items;},whack:whack};
})();
</script>
</body>
</html>
